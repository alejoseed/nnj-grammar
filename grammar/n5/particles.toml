# N5 particles — single-token patterns
# These are the simplest possible patterns: match one token by surface + POS.
# The matcher only needs to handle non-wildcard steps to make these work.

[[patterns]]
id         = "wa-topic"
name       = "は (topic)"
jlpt       = "N5"
meaning_en = "topic marker — introduces what the sentence is about"

[[patterns.steps]]
surface = "は"
pos1    = "助詞"
pos2    = "係助詞"

# ─────────────────────────────────────────────────────────────────────────────

[[patterns]]
id         = "ga-subject"
name       = "が (subject)"
jlpt       = "N5"
meaning_en = "subject marker — marks the grammatical subject"

[[patterns.steps]]
surface = "が"
pos1    = "助詞"
pos2    = "格助詞"

