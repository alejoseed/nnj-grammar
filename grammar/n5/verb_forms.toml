[[patterns]]
id         = "te-kara"
name       = "〜てから"
jlpt       = "N5"
meaning_en = "after doing ~ (temporal sequence)"
hint       = "Verb te-form + から. The first action must be fully completed before the second begins."

[[patterns.steps]]
pos1 = "動詞"

[[patterns.steps]]
pos1 = "助詞"
pos2 = "接続助詞"

[[patterns.steps]]
surface = "から"
pos1    = "助詞"

