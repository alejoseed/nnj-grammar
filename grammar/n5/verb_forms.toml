[[patterns]]
id         = "te-iru"
name       = "〜ている"
jlpt       = "N5"
meaning_en = "ongoing action or resultant state"
hint       = "Verb te-form + いる. Indicates something is currently happening (食べている = is eating) or a state resulting from a past action (結婚している = is married)."

[[patterns.steps]]
pos1 = "動詞"

[[patterns.steps]]
pos1 = "助詞"
pos2 = "接続助詞"

[[patterns.steps]]
pos1 = "動詞"
pos2 = "非自立可能"

