# N5 verb form patterns
#
# These patterns need the exact UniDic conjugation form values verified
# against actual tokenizer output before they can be added back.
#
# Run: nnj-grammar --output table "食べている"
#      nnj-grammar --output table "食べてから帰った"
#      nnj-grammar --output table "食べてください"
#
# Then check the ConjForm column and rebuild each pattern step by step.
# The table output for 食べている shows:
#   食べ  →  動詞  一般  連用形-一般
#   て    →  助詞  接続助詞
#   いる  →  動詞  非自立可能  終止形-一般
#
# Each pattern needs all three tokens as separate steps.
