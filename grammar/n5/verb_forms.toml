[[patterns]]
id         = "te-iru"
name       = "〜ている"
jlpt       = "N5"
meaning_en = "ongoing action or resultant state"
hint       = "Verb te-form + いる. Indicates something is currently happening (食べている = is eating) or a state resulting from a past action (結婚している = is married)."

# Step 1: any verb in te-form
# UniDic te-form variants (all match pos1=動詞, pos2=接続助詞 on the て/で):
#   連用形-一般        食べて, 見て, 起きて
#   連用形-促音便      帰って, 揃って, 行って (っ + て)
#   連用形-撥音便      飲んで, 読んで       (ん + で)
#   連用形-ウ音便      書いて, 聞いて       (い + て)
# We match on pos1=動詞 only — any te-form verb qualifies.
[[patterns.steps]]
pos1 = "動詞"

# Step 2: the て/で connector particle
[[patterns.steps]]
pos1 = "助詞"
pos2 = "接続助詞"

# Step 3: いる (auxiliary, non-independent verb)
[[patterns.steps]]
pos1 = "動詞"
pos2 = "非自立可能"
