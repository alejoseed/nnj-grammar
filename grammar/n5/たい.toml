[[patterns]]
id         = "tai-want"
name       = "〜たい"
jlpt       = "N5"
meaning_en = "want to do ~ (expresses the speaker's desire to perform an action)"
hint       = "Attaches to the verb stem (連用形). Only used for the speaker's own desires — not for guessing what others want (use 〜たがる for that)."

[[patterns.steps]]
pos1      = "動詞"
conj_form = "連用形-一般"

[[patterns.steps]]
surface = "たい"
pos1    = "助動詞"
