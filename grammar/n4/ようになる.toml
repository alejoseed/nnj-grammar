[[patterns]]
id         = "you-ni-naru"
name       = "〜ようになる"
jlpt       = "N4"
meaning_en = "come to do; reach the point where; it has become that"
hint       = "Verb dictionary/potential form + ようになる. Indicates a gradual change of state or acquisition of ability."

# Example: 日本語が話せるようになった
# 話せる 動詞 一般 連体形-一般
# よう   形状詞 助動詞語幹
# に     助動詞 連用形-ニ  (base_form=だ)
# なっ   動詞 非自立可能 連用形-促音便 (base_form=成る)

[[patterns.steps]]
pos1 = "動詞"

[[patterns.steps]]
surface = "よう"
pos1    = "形状詞"

[[patterns.steps]]
pos1      = "助動詞"
conj_form = "連用形-ニ"

[[patterns.steps]]
pos1      = "動詞"
pos2      = "非自立可能"
base_form = "成る"
