[[patterns]]
id         = "deshou"
name       = "〜でしょう"
jlpt       = "N4"
meaning_en = "probably; I think; don't you think? (polite conjecture)"
hint       = "Plain predicate + でしょう. Polite form of だろう. Expresses probability or seeks confirmation."

# Example: 明日は晴れるでしょう
# 晴れる 動詞 一般 終止形-一般
# でしょう 助動詞 意志推量形 base_form=です

[[patterns.steps]]
surface   = "でしょう"
pos1      = "助動詞"
base_form = "です"


[[patterns]]
id         = "darou"
name       = "〜だろう"
jlpt       = "N4"
meaning_en = "probably; I suppose; I wonder (plain conjecture)"
hint       = "Plain predicate + だろう. Expresses the speaker's conjecture or probability."

# Example: 彼は来るだろう
# 来る  動詞 非自立可能 終止形-一般
# だろう 助動詞 意志推量形 base_form=だ

[[patterns.steps]]
surface   = "だろう"
pos1      = "助動詞"
base_form = "だ"
