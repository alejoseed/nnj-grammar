[[patterns]]
id         = "ni-totte"
name       = "〜にとって"
jlpt       = "N4"
meaning_en = "for; to; from the standpoint of"
hint       = "Noun + にとって. Expresses a viewpoint or perspective."

# Example: 私にとって日本語は難しい
# に    助詞 格助詞
# とっ  動詞 一般 連用形-促音便 base_form=取る
# て    助詞 接続助詞

[[patterns.steps]]
surface = "に"
pos1    = "助詞"
pos2    = "格助詞"

[[patterns.steps]]
surface   = "とっ"
base_form = "取る"

[[patterns.steps]]
surface = "て"
pos1    = "助詞"
pos2    = "接続助詞"
