[[patterns]]
id         = "tokoro-da-progressive"
name       = "〜ているところだ"
jlpt       = "N4"
meaning_en = "be in the middle of doing; be right in the process of"
hint       = "Verb te-iru form + ところだ. Emphasizes the action is currently in progress."

# Example: 今食べているところだ
# いる  動詞 非自立可能 連体形-一般 base_form=居る
# ところ 名詞 普通名詞 base_form=所
# だ    助動詞 終止形-一般

[[patterns.steps]]
pos1      = "動詞"
pos2      = "非自立可能"
base_form = "居る"

[[patterns.steps]]
surface   = "ところ"
pos1      = "名詞"

[[patterns.steps]]
pos1      = "助動詞"
base_form = "だ"


[[patterns]]
id         = "tokoro-da-about-to"
name       = "〜ところだ (about to)"
jlpt       = "N4"
meaning_en = "be just about to do; be on the verge of doing"
hint       = "Verb dictionary form + ところだ. The action is imminent."

[[patterns.steps]]
pos1 = "動詞"

[[patterns.steps]]
surface = "ところ"
pos1    = "名詞"

[[patterns.steps]]
pos1      = "助動詞"
base_form = "だ"


[[patterns]]
id         = "tokoro-da-just-did"
name       = "〜たところだ (just did)"
jlpt       = "N4"
meaning_en = "have just done; just finished doing"
hint       = "Verb ta-form + ところだ. The action was completed moments ago."

[[patterns.steps]]
pos1      = "助動詞"
base_form = "た"

[[patterns.steps]]
surface = "ところ"
pos1    = "名詞"

[[patterns.steps]]
pos1      = "助動詞"
base_form = "だ"
