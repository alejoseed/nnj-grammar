[[patterns]]
id         = "bakari"
name       = "〜ばかり"
jlpt       = "N4"
meaning_en = "only; nothing but; just; approximately; have just done"
hint       = "Noun/verb + ばかり. Can indicate doing nothing but one thing, or approximate quantity."

# Example: ばかり食べている (nothing but eating)
# ばかり 助詞 副助詞

[[patterns.steps]]
surface = "ばかり"
pos1    = "助詞"
pos2    = "副助詞"


[[patterns]]
id         = "ta-bakari"
name       = "〜たばかり"
jlpt       = "N4"
meaning_en = "have just done; just did (very recently)"
hint       = "Verb ta-form + ばかり. Indicates an action was completed very recently."

# Example: 食べたばかりだ
# た     助動詞 連体形-一般 base_form=た
# ばかり 助詞 副助詞

[[patterns.steps]]
pos1      = "助動詞"
base_form = "た"

[[patterns.steps]]
surface = "ばかり"
pos1    = "助詞"
pos2    = "副助詞"
