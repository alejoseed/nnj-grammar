[[patterns]]
id         = "te-form-connector"
name       = "〜て (te-form connector)"
jlpt       = "N4"
meaning_en = "and then; so; because of (sequential or causal connector)"
hint       = "Verb te-form + て/で. Connects clauses sequentially or causally."

# The て/で connector particle
# て/で  助詞 接続助詞

[[patterns.steps]]
pos1 = "動詞"

[[patterns.steps]]
pos1 = "助詞"
pos2 = "接続助詞"


[[patterns]]
id         = "te-shimau"
name       = "〜てしまう"
jlpt       = "N4"
meaning_en = "end up doing; do completely; do regrettably"
hint       = "Verb te-form + しまう. Indicates an action is completed (often with regret or unintended result)."

# Example: 宿題をしてしまった
# し    動詞 非自立可能 連用形-一般
# て    助詞 接続助詞
# しまっ 動詞 非自立可能 連用形-促音便 base_form=仕舞う

[[patterns.steps]]
pos1 = "動詞"

[[patterns.steps]]
pos1 = "助詞"
pos2 = "接続助詞"

[[patterns.steps]]
pos1      = "動詞"
pos2      = "非自立可能"
base_form = "仕舞う"


[[patterns]]
id         = "te-oku"
name       = "〜ておく"
jlpt       = "N4"
meaning_en = "do in advance; do and leave it that way; do for future use"
hint       = "Verb te-form + おく. Action is done in preparation or left in a certain state."

# Example: 本を読んでおく
# 読ん  動詞 一般 連用形-撥音便
# で    助詞 接続助詞
# おく  動詞 非自立可能 base_form=置く

[[patterns.steps]]
pos1 = "動詞"

[[patterns.steps]]
pos1 = "助詞"
pos2 = "接続助詞"

[[patterns.steps]]
pos1      = "動詞"
pos2      = "非自立可能"
base_form = "置く"


[[patterns]]
id         = "te-miru"
name       = "〜てみる"
jlpt       = "N4"
meaning_en = "try doing; do and see what happens"
hint       = "Verb te-form + みる. The speaker attempts an action to see the result."

# Example: 食べてみる
# 食べ  動詞 一般 連用形-一般
# て    助詞 接続助詞
# みる  動詞 非自立可能 base_form=見る

[[patterns.steps]]
pos1 = "動詞"

[[patterns.steps]]
pos1 = "助詞"
pos2 = "接続助詞"

[[patterns.steps]]
pos1      = "動詞"
pos2      = "非自立可能"
base_form = "見る"


[[patterns]]
id         = "te-hoshii"
name       = "〜てほしい"
jlpt       = "N4"
meaning_en = "want someone to do; I want you to do"
hint       = "Verb te-form + ほしい. Expresses a desire for another person to perform an action."

# Example: 彼女に来てほしい
# 来    動詞 非自立可能 連用形-一般
# て    助詞 接続助詞
# ほしい 形容詞 非自立可能 base_form=欲しい

[[patterns.steps]]
pos1 = "動詞"

[[patterns.steps]]
pos1 = "助詞"
pos2 = "接続助詞"

[[patterns.steps]]
pos1      = "形容詞"
base_form = "欲しい"


[[patterns]]
id         = "te-wa-ikenai"
name       = "〜てはいけない"
jlpt       = "N4"
meaning_en = "must not do; it is not allowed to"
hint       = "Verb te-form + は + いけない. Expresses prohibition."

# Example: ここに入ってはいけない
# 入っ  動詞 一般 連用形-促音便
# て    助詞 接続助詞
# は    助詞 係助詞
# いけ  動詞 非自立可能 未然形-一般 base_form=行く
# ない  助動詞 終止形-一般

[[patterns.steps]]
pos1 = "動詞"

[[patterns.steps]]
pos1 = "助詞"
pos2 = "接続助詞"

[[patterns.steps]]
surface = "は"
pos1    = "助詞"
pos2    = "係助詞"

[[patterns.steps]]
pos1      = "動詞"
pos2      = "非自立可能"
base_form = "行く"

[[patterns.steps]]
pos1      = "助動詞"
base_form = "ない"


[[patterns]]
id         = "te-kureru"
name       = "〜てくれる"
jlpt       = "N4"
meaning_en = "do something for me/us (someone does a favor for the speaker's side)"
hint       = "Verb te-form + くれる. A third person does a favor benefiting the speaker."

# Example: 彼女に来てくれた
# 来    動詞 非自立可能 連用形-一般
# て    助詞 接続助詞
# くれ  動詞 非自立可能 連用形-一般 base_form=呉れる

[[patterns.steps]]
pos1 = "動詞"

[[patterns.steps]]
pos1 = "助詞"
pos2 = "接続助詞"

[[patterns.steps]]
pos1      = "動詞"
pos2      = "非自立可能"
base_form = "呉れる"
