[[patterns]]
id         = "ni-suru"
name       = "〜にする"
jlpt       = "N4"
meaning_en = "decide on; make it; choose (something)"
hint       = "Noun + にする. Used when deciding or choosing between options."

# Example: コーヒーにする
# に    助詞 格助詞
# する  動詞 非自立可能 base_form=為る

[[patterns.steps]]
surface = "に"
pos1    = "助詞"
pos2    = "格助詞"

[[patterns.steps]]
pos1      = "動詞"
pos2      = "非自立可能"
base_form = "為る"
