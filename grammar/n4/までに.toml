[[patterns]]
id         = "made-ni"
name       = "〜までに"
jlpt       = "N4"
meaning_en = "by (a deadline); by the time"
hint       = "Time noun/verb plain form + までに. Sets a deadline by which the action must be completed."

# Example: 今日中にレポートを提出するまでに
# まで  助詞 副助詞
# に    助詞 格助詞

[[patterns.steps]]
surface = "まで"
pos1    = "助詞"
pos2    = "副助詞"

[[patterns.steps]]
surface = "に"
pos1    = "助詞"
pos2    = "格助詞"
