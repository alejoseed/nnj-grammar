[[patterns]]
id         = "nakereba-naranai"
name       = "〜なければならない"
jlpt       = "N4"
meaning_en = "must do; have to do; it is necessary to"
hint       = "Verb negative stem + なければならない. Expresses obligation or necessity."

# Example: 早く起きなければならない
# 起き   動詞 一般 未然形-一般
# なけれ  助動詞 仮定形-一般 base_form=ない
# ば     助詞 接続助詞
# なら   動詞 非自立可能 未然形-一般 base_form=成る
# ない   助動詞 終止形-一般 base_form=ない

[[patterns.steps]]
pos1      = "動詞"
conj_form = "未然形-一般"

[[patterns.steps]]
pos1      = "助動詞"
conj_form = "仮定形-一般"
base_form = "ない"

[[patterns.steps]]
surface = "ば"
pos1    = "助詞"
pos2    = "接続助詞"

[[patterns.steps]]
pos1      = "動詞"
pos2      = "非自立可能"
base_form = "成る"

[[patterns.steps]]
pos1      = "助動詞"
base_form = "ない"


[[patterns]]
id         = "nakute-wa-ikenai"
name       = "〜なくてはいけない"
jlpt       = "N4"
meaning_en = "must do; have to do (slightly softer than なければならない)"
hint       = "Verb negative te-form (なくて) + はいけない. Expresses obligation."

# Example: 宿題をしなくてはいけない
# し    動詞 未然形-一般
# なく  助動詞 連用形-一般 base_form=ない
# て    助詞 接続助詞
# は    助詞 係助詞
# いけ  動詞 非自立可能 未然形-一般 base_form=行く
# ない  助動詞 終止形-一般

[[patterns.steps]]
pos1      = "動詞"
conj_form = "未然形-一般"

[[patterns.steps]]
pos1      = "助動詞"
conj_form = "連用形-一般"
base_form = "ない"

[[patterns.steps]]
pos1 = "助詞"
pos2 = "接続助詞"

[[patterns.steps]]
surface = "は"
pos1    = "助詞"
pos2    = "係助詞"

[[patterns.steps]]
pos1      = "動詞"
pos2      = "非自立可能"
base_form = "行く"

[[patterns.steps]]
pos1      = "助動詞"
base_form = "ない"
