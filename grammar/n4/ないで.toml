[[patterns]]
id         = "nai-de"
name       = "〜ないで"
jlpt       = "N4"
meaning_en = "without doing; do not do ~ and (instead do something else)"
hint       = "Verb negative form ない + で (conjunctive). Connects clauses: the first action is not done."

# Example: 食べないでおく
# 食べ  動詞 一般 未然形-一般
# ない  助動詞 終止形-一般 base_form=ない
# で    助詞 接続助詞

[[patterns.steps]]
pos1      = "動詞"
conj_form = "未然形-一般"

[[patterns.steps]]
pos1      = "助動詞"
base_form = "ない"
conj_form = "終止形-一般"

[[patterns.steps]]
pos1 = "助詞"
pos2 = "接続助詞"
