[[patterns]]
id         = "kamoshirenai"
name       = "〜かもしれない"
jlpt       = "N4"
meaning_en = "might; maybe; possibly"
hint       = "Predicate plain form + かもしれない. Expresses possibility or uncertainty."

# Example: 雨が降るかもしれない
# か   助詞 副助詞
# も   助詞 係助詞
# しれ  動詞 一般 未然形-一般 (base_form=知れる)
# ない  助動詞 終止形-一般 (base_form=ない)

[[patterns.steps]]
surface = "か"
pos1    = "助詞"
pos2    = "副助詞"

[[patterns.steps]]
surface = "も"
pos1    = "助詞"
pos2    = "係助詞"

[[patterns.steps]]
base_form = "知れる"

[[patterns.steps]]
pos1      = "助動詞"
base_form = "ない"
