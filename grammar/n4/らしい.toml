[[patterns]]
id         = "rashii"
name       = "〜らしい"
jlpt       = "N4"
meaning_en = "seems like; apparently; I heard that; looks like (based on evidence or hearsay)"
hint       = "Attaches to plain predicate forms. Expresses inference from evidence or information from others."

# Example: 彼は来るらしい
# 来る  動詞 非自立可能 終止形-一般
# らしい 助動詞 終止形-一般 base_form=らしい

[[patterns.steps]]
pos1      = "助動詞"
base_form = "らしい"
