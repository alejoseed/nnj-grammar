[[patterns]]
id         = "nakanaka-nai"
name       = "なかなか〜ない"
jlpt       = "N4"
meaning_en = "not easily; not readily; just won't (do as expected)"
hint       = "なかなか + negative predicate. Expresses frustration that something expected does not happen easily."

# Example: なかなか来ない
# なかなか 副詞
# 来     動詞 未然形-一般
# ない   助動詞 base_form=ない

[[patterns.steps]]
surface = "なかなか"
pos1    = "副詞"

[[patterns.steps]]
wildcard = { min = 0, max = 4 }

[[patterns.steps]]
pos1      = "助動詞"
base_form = "ない"


[[patterns]]
id         = "nakanaka-positive"
name       = "なかなか (quite / rather)"
jlpt       = "N4"
meaning_en = "quite; rather; pretty; considerably (with positive predicates)"
hint       = "なかなか + positive adjective or verb. Expresses that something is better than expected."

[[patterns.steps]]
surface = "なかなか"
pos1    = "副詞"
