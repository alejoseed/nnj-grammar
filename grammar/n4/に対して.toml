[[patterns]]
id         = "ni-taishite"
name       = "〜に対して"
jlpt       = "N4"
meaning_en = "toward; to; against; in contrast to; with regard to"
hint       = "Noun + に対して. Marks the target of an action, feeling, or contrast."

# Example: 学生に対して説明する
# に     助詞 格助詞
# 対し   動詞 一般 連用形-一般 base_form=対する
# て     助詞 接続助詞

[[patterns.steps]]
surface = "に"
pos1    = "助詞"
pos2    = "格助詞"

[[patterns.steps]]
surface   = "対し"
base_form = "対する"

[[patterns.steps]]
surface = "て"
pos1    = "助詞"
pos2    = "接続助詞"
