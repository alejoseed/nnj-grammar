[[patterns]]
id         = "nagara-while"
name       = "〜ながら (while doing)"
jlpt       = "N4"
meaning_en = "while doing; at the same time as"
hint       = "Verb masu-stem + ながら. Both actions happen simultaneously by the same subject."

# Example: 音楽を聴きながら勉強する
# 聴き  動詞 一般 連用形-一般
# ながら 助詞 接続助詞

[[patterns.steps]]
pos1      = "動詞"
conj_form = "連用形-一般"

[[patterns.steps]]
surface = "ながら"
pos1    = "助詞"
pos2    = "接続助詞"


[[patterns]]
id         = "nagara-although"
name       = "〜ながら (although)"
jlpt       = "N4"
meaning_en = "although; even though; despite"
hint       = "Noun/adj-stem + ながら expresses a concessive contrast."

[[patterns.steps]]
surface = "ながら"
pos1    = "助詞"
pos2    = "接続助詞"
