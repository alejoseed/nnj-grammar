[[patterns]]
id         = "tara-conditional"
name       = "〜たら"
jlpt       = "N4"
meaning_en = "if; when; once (conditional — after completing the first action)"
hint       = "Verb/adjective ta-form + ら → たら. Used for hypothetical conditions or sequential events."

# Example: 雨が降ったら傘を持っていく
# 降っ  動詞 一般 連用形-促音便
# たら  助動詞 仮定形-一般 base_form=た

[[patterns.steps]]
pos1      = "助動詞"
conj_form = "仮定形-一般"
base_form = "た"
