[[patterns]]
id         = "you-da"
name       = "〜ようだ"
jlpt       = "N4"
meaning_en = "it seems that; it looks like; it appears that (based on speaker's direct observation)"
hint       = "Plain predicate + ようだ. The speaker draws an inference from what they directly perceive."

# Example: 雨が降るようだ
# よう  形状詞 助動詞語幹  surface=よう
# だ    助動詞 終止形-一般

[[patterns.steps]]
surface = "よう"
pos1    = "形状詞"

[[patterns.steps]]
pos1      = "助動詞"
base_form = "だ"
