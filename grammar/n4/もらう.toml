[[patterns]]
id         = "te-morau"
name       = "〜てもらう"
jlpt       = "N4"
meaning_en = "have someone do something for you; receive the benefit of an action"
hint       = "Verb te-form + もらう. The subject receives a favor done by someone else."

# Example: 手伝ってもらう
# 手伝っ 動詞 一般 連用形-促音便
# て    助詞 接続助詞
# もらう 動詞 非自立可能 (base_form=貰う)

[[patterns.steps]]
pos1 = "動詞"

[[patterns.steps]]
pos1 = "助詞"
pos2 = "接続助詞"

[[patterns.steps]]
pos1      = "動詞"
pos2      = "非自立可能"
base_form = "貰う"
