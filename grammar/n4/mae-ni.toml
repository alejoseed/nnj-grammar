[[patterns]]
id         = "mae-ni"
name       = "〜前に"
jlpt       = "N4"
meaning_en = "before doing; before (an event)"
hint       = "Verb dictionary form / Noun の + 前に. Marks the time before an action takes place."

# Example: 食事の前に手を洗う  /  本を買う前に図書館で借りる
# 前    名詞 普通名詞 base_form=前
# に    助詞 格助詞

[[patterns.steps]]
surface   = "前"
base_form = "前"
pos1      = "名詞"

[[patterns.steps]]
surface = "に"
pos1    = "助詞"
pos2    = "格助詞"
