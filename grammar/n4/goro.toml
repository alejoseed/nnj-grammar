[[patterns]]
id         = "goro"
name       = "〜ごろ"
jlpt       = "N4"
meaning_en = "around; about; approximately (a point in time)"
hint       = "Time noun + ごろ. Indicates an approximate point in time. Use ごろ for points, ぐらい/くらい for durations."

# Example: 三時ごろ家に帰る
# ごろ  名詞 普通名詞 base_form=頃

[[patterns.steps]]
surface   = "ごろ"
base_form = "頃"
pos1      = "名詞"
