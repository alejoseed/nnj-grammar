[[patterns]]
id         = "sugiru-verb"
name       = "〜すぎる (verb)"
jlpt       = "N4"
meaning_en = "do too much; overdo; excessively"
hint       = "Verb masu-stem + すぎる. The action is done to an excessive degree."

# Example: 食べすぎる
# 食べ  動詞 一般 連用形-一般
# すぎる 動詞 非自立可能 base_form=過ぎる

[[patterns.steps]]
pos1      = "動詞"
conj_form = "連用形-一般"

[[patterns.steps]]
pos1      = "動詞"
pos2      = "非自立可能"
base_form = "過ぎる"


[[patterns]]
id         = "sugiru-adj"
name       = "〜すぎる (adjective)"
jlpt       = "N4"
meaning_en = "too (adjective); excessively (adjective)"
hint       = "Adjective stem (語幹-一般) + すぎる. The quality is excessive."

# Example: この問題は難しすぎる
# 難し  形容詞 一般 語幹-一般 base_form=難しい
# すぎる 動詞 非自立可能 base_form=過ぎる

[[patterns.steps]]
pos1      = "形容詞"
conj_form = "語幹-一般"

[[patterns.steps]]
pos1      = "動詞"
pos2      = "非自立可能"
base_form = "過ぎる"
