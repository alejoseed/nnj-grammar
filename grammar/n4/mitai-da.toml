[[patterns]]
id         = "mitai-da"
name       = "〜みたいだ"
jlpt       = "N4"
meaning_en = "looks like; seems like; it appears that (casual, based on appearance)"
hint       = "Noun/plain predicate + みたいだ. Casual equivalent of ようだ. Based on direct perception."

# Example: 彼女は学生みたいだ
# 学生  名詞
# みたい 形状詞 助動詞語幹 base_form=みたい
# だ    助動詞 終止形-一般

[[patterns.steps]]
surface   = "みたい"
pos1      = "形状詞"

[[patterns.steps]]
pos1      = "助動詞"
base_form = "だ"
