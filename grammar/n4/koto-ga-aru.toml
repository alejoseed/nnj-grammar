[[patterns]]
id         = "koto-ga-aru"
name       = "〜ことがある"
jlpt       = "N4"
meaning_en = "there are times when; sometimes; have experienced doing"
hint       = "Verb ta-form + ことがある = have experienced. Verb dictionary form + ことがある = sometimes happens."

# Example: 映画を見たことがある
# 見    動詞 非自立可能 連用形-一般
# た    助動詞 連体形-一般 base_form=た
# こと  名詞 普通名詞 base_form=事
# が    助詞 格助詞
# ある  動詞 非自立可能 base_form=有る

[[patterns.steps]]
pos1      = "助動詞"
base_form = "た"

[[patterns.steps]]
surface   = "こと"
pos1      = "名詞"
base_form = "事"

[[patterns.steps]]
surface = "が"
pos1    = "助詞"
pos2    = "格助詞"

[[patterns.steps]]
pos1      = "動詞"
pos2      = "非自立可能"
base_form = "有る"


[[patterns]]
id         = "koto-ga-aru-dict"
name       = "〜ことがある (sometimes)"
jlpt       = "N4"
meaning_en = "there are times when; sometimes it happens that"
hint       = "Verb dictionary form + ことがある. Indicates something occasionally occurs."

[[patterns.steps]]
pos1 = "動詞"

[[patterns.steps]]
surface   = "こと"
pos1      = "名詞"
base_form = "事"

[[patterns.steps]]
surface = "が"
pos1    = "助詞"
pos2    = "格助詞"

[[patterns.steps]]
pos1      = "動詞"
pos2      = "非自立可能"
base_form = "有る"
