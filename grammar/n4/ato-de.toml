[[patterns]]
id         = "ato-de"
name       = "〜あとで"
jlpt       = "N4"
meaning_en = "after doing; after (an event)"
hint       = "Verb ta-form / Noun の + あとで. Marks that one action follows the completion of another."

# Example: 授業が終わったあとで友達と話した
# た    助動詞 連体形-一般 base_form=た
# あと  名詞 普通名詞 base_form=後
# で    助詞 格助詞

[[patterns.steps]]
pos1      = "助動詞"
base_form = "た"

[[patterns.steps]]
surface   = "あと"
base_form = "後"
pos1      = "名詞"

[[patterns.steps]]
surface = "で"
pos1    = "助詞"
pos2    = "格助詞"
