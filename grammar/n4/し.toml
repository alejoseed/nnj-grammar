[[patterns]]
id         = "shi-listing"
name       = "〜し〜し"
jlpt       = "N4"
meaning_en = "and; what's more; not only ~ but also ~ (listing reasons or qualities)"
hint       = "Plain predicate + し. Lists multiple reasons or attributes, often implying 'and what's more'."

# Example: 天気もいいし気温も高い
# いい  形容詞 終止形-一般
# し    助詞 接続助詞

[[patterns.steps]]
surface = "し"
pos1    = "助詞"
pos2    = "接続助詞"
