[[patterns]]
id         = "koto-ga-dekiru"
name       = "〜ことができる"
jlpt       = "N4"
meaning_en = "can do; be able to do; it is possible to"
hint       = "Verb dictionary form + ことができる. Formal expression of ability or possibility."

# Example: 泳ぐことができる
# 泳ぐ  動詞 一般 連体形-一般
# こと  名詞 普通名詞 base_form=事
# が    助詞 格助詞
# できる 動詞 非自立可能 base_form=出来る

[[patterns.steps]]
pos1 = "動詞"

[[patterns.steps]]
surface   = "こと"
pos1      = "名詞"
base_form = "事"

[[patterns.steps]]
surface = "が"
pos1    = "助詞"
pos2    = "格助詞"

[[patterns.steps]]
pos1      = "動詞"
pos2      = "非自立可能"
base_form = "出来る"
