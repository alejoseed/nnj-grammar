[[patterns]]
id         = "ni-tsuite"
name       = "〜について"
jlpt       = "N4"
meaning_en = "about; concerning; regarding; on the topic of"
hint       = "Noun + について. Introduces the topic being discussed."

# Example: 日本語について話す
# に    助詞 格助詞
# つい  動詞 一般 連用形-イ音便 base_form=つく
# て    助詞 接続助詞

[[patterns.steps]]
surface = "に"
pos1    = "助詞"
pos2    = "格助詞"

[[patterns.steps]]
surface   = "つい"
base_form = "つく"

[[patterns.steps]]
surface = "て"
pos1    = "助詞"
pos2    = "接続助詞"
