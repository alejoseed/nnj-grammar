[[patterns]]
id         = "passive-reru-rareru"
name       = "〜れる／〜られる (passive)"
jlpt       = "N4"
meaning_en = "be done to; passive form — the subject receives the action"
hint       = "Verb negative stem + れる (godan) or られる (ichidan/irregular). Also expresses potential and respect."

# Example: 花瓶が割られた
# 割ら  動詞 一般 未然形-一般
# れ    助動詞 連用形-一般 base_form=れる
# た    助動詞 終止形-一般

[[patterns.steps]]
pos1      = "動詞"
conj_form = "未然形-一般"

[[patterns.steps]]
pos1      = "助動詞"
base_form = "れる"


[[patterns]]
id         = "passive-rareru"
name       = "〜られる (passive — ichidan)"
jlpt       = "N4"
meaning_en = "be done to; passive form for ichidan and irregular verbs"

[[patterns.steps]]
pos1      = "動詞"
conj_form = "未然形-一般"

[[patterns.steps]]
pos1      = "助動詞"
base_form = "られる"
