[[patterns]]
id         = "tame-ni-purpose"
name       = "〜ために (purpose)"
jlpt       = "N4"
meaning_en = "in order to; for the purpose of"
hint       = "Verb dictionary form / Noun の + ために. Expresses purpose or goal."

# Example: 健康のために運動する
# ため  名詞 普通名詞 base_form=為
# に    助詞 格助詞

[[patterns.steps]]
surface   = "ため"
base_form = "為"
pos1      = "名詞"

[[patterns.steps]]
surface = "に"
pos1    = "助詞"
pos2    = "格助詞"


[[patterns]]
id         = "tame-ni-cause"
name       = "〜ために (cause/reason)"
jlpt       = "N4"
meaning_en = "because of; due to; owing to"
hint       = "Verb ta-form / noun + ために. Expresses a reason or cause, often for negative outcomes."

# Example: 風邪を引いたために学校を休んだ
# た    助動詞 連体形-一般 base_form=た
# ため  名詞 普通名詞 base_form=為
# に    助詞 格助詞

[[patterns.steps]]
pos1      = "助動詞"
base_form = "た"

[[patterns.steps]]
surface   = "ため"
base_form = "為"
pos1      = "名詞"

[[patterns.steps]]
surface = "に"
pos1    = "助詞"
pos2    = "格助詞"
