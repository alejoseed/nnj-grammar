[[patterns]]
id         = "te-kudasaimasenka"
name       = "〜てくださいませんか"
jlpt       = "N4"
meaning_en = "would you please do; could you please do (very polite request)"
hint       = "Verb te-form + くださいませんか. The most polite way to make a request of someone."

# Example: ドアを開けてくださいませんか
# 開け  動詞 一般 連用形-一般
# て    助詞 接続助詞
# ください 動詞 非自立可能 連用形-イ音便 base_form=下さる
# ませ  助動詞 未然形-一般 base_form=ます
# ん    助動詞 終止形-撥音便 base_form=ず
# か    助詞 終助詞

[[patterns.steps]]
pos1 = "動詞"

[[patterns.steps]]
pos1 = "助詞"
pos2 = "接続助詞"

[[patterns.steps]]
base_form = "下さる"

[[patterns.steps]]
pos1      = "助動詞"
base_form = "ます"

[[patterns.steps]]
pos1      = "助動詞"
base_form = "ず"

[[patterns.steps]]
surface = "か"
pos1    = "助詞"
