[[patterns]]
id         = "ba-yokatta"
name       = "〜ばよかった"
jlpt       = "N4"
meaning_en = "should have done; I wish I had done; it would have been better if"
hint       = "Verb conditional ば form + よかった. Expresses regret about a past action not taken."

# Example: 早く来ればよかった
# 来れ  動詞 非自立可能 仮定形-一般
# ば    助詞 接続助詞
# よかっ 形容詞 非自立可能 連用形-促音便 base_form=良い
# た    助動詞 終止形-一般 base_form=た

[[patterns.steps]]
pos1      = "動詞"
conj_form = "仮定形-一般"

[[patterns.steps]]
surface = "ば"
pos1    = "助詞"
pos2    = "接続助詞"

[[patterns.steps]]
pos1      = "形容詞"
base_form = "良い"

[[patterns.steps]]
pos1      = "助動詞"
base_form = "た"
