[[patterns]]
id         = "yasui"
name       = "〜やすい"
jlpt       = "N4"
meaning_en = "easy to do; prone to"
hint       = "Verb masu-stem + やすい. Indicates an action is easy to perform or a tendency to occur."

# Example: この本は読みやすい
# 読み  動詞 一般 連用形-一般
# やすい 接尾辞 形容詞的 base_form=易い

[[patterns.steps]]
pos1      = "動詞"
conj_form = "連用形-一般"

[[patterns.steps]]
surface   = "やすい"
base_form = "易い"


[[patterns]]
id         = "nikui"
name       = "〜にくい"
jlpt       = "N4"
meaning_en = "hard to do; difficult to do"
hint       = "Verb masu-stem + にくい. Indicates an action is difficult to perform."

# Example: この道は歩きにくい
# 歩き  動詞 一般 連用形-一般
# にくい 接尾辞 形容詞的 base_form=難い

[[patterns.steps]]
pos1      = "動詞"
conj_form = "連用形-一般"

[[patterns.steps]]
surface   = "にくい"
base_form = "難い"
