[[patterns]]
id         = "you-ni-suru"
name       = "〜ようにする"
jlpt       = "N4"
meaning_en = "make sure to do; see to it that; try to do (as a habit)"
hint       = "Verb dictionary/potential form + ようにする. Expresses conscious effort to establish or maintain a behavior."

# Example: 毎朝運動するようにしている
# する  動詞 非自立可能 連体形-一般
# よう  形状詞 助動詞語幹
# に    助動詞 連用形-ニ
# し    動詞 非自立可能 連用形-一般 (base_form=為る)

[[patterns.steps]]
pos1 = "動詞"

[[patterns.steps]]
surface = "よう"
pos1    = "形状詞"

[[patterns.steps]]
pos1      = "助動詞"
conj_form = "連用形-ニ"

[[patterns.steps]]
pos1      = "動詞"
pos2      = "非自立可能"
base_form = "為る"
