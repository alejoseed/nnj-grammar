[[patterns]]
id         = "te-yaru"
name       = "〜てやる"
jlpt       = "N4"
meaning_en = "do something for someone (casual/condescending nuance, or for animals/plants)"
hint       = "Verb te-form + やる. Casual equivalent of てあげる; can imply doing something despite inconvenience."

# Example: 花に水をやる / 教えてやる
# て/で  助詞 接続助詞
# やる   動詞 非自立可能 (base_form=遣る)

[[patterns.steps]]
pos1 = "動詞"

[[patterns.steps]]
pos1 = "助詞"
pos2 = "接続助詞"

[[patterns.steps]]
pos1      = "動詞"
pos2      = "非自立可能"
base_form = "遣る"
