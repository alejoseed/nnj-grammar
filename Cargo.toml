[package]
name = "nnj-grammar"
version = "0.1.0"
edition = "2021"
default-run = "nnj-grammar"

[lib]
name = "nnj_grammar"
path = "src/lib.rs"

[[bin]]
name = "nnj-grammar"
path = "src/main.rs"

[[bin]]
name = "nnj-grammar-server"
path = "src/bin/server.rs"

[dependencies]
# Japanese morphological analyzer.
# Using lindera with the UniDic dictionary (same POS taxonomy as Sudachi).
# embed-unidic bakes the dictionary into the binary at compile time.
# The official Sudachi Rust library is not published to crates.io as a library crate.
lindera = { version = "=3.0.7", features = ["embed-unidic"] }

# Graph data structure
petgraph = { version = "0.8", features = ["serde-1"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# TOML rule files
toml = "0.8"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Recursive directory walking for grammar DB
walkdir = "2"

# Ergonomic error handling
anyhow = "1"

# Embed grammar TOML files into the binary at compile time.
# This makes the binary self-contained — no grammar/ directory needed at runtime.
# Used on iOS (no writable filesystem for resources) and for single-binary distribution.
rust-embed = { version = "8", features = ["include-exclude"] }

# Loopback HTTP server for the local desktop analysis API.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# The real-TCP smoke test in tests/server.rs uses tokio's async IO extension
# traits and timeouts; union these features in for test builds only.
tokio = { version = "1", features = ["io-util", "time"] }

[profile.release]
lto = true
strip = true
opt-level = 3
